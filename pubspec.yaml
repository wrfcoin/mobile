name: wrfcoin_mobile
description: "WRFCoin Mobile - Weather data collection, forecasts, and blockchain wallet"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7

  # Routing
  go_router: ^18.0.2

  # Networking
  dio: ^5.11.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  bip39: ^1.0.6
  pointycastle: ^3.9.1
  web3dart: ^2.7.3

  # Local storage
  flutter_secure_storage: ^11.2.0
  drift: 2.35.2
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.6

  # Path utilities
  path_provider: ^2.1.6
  path: ^1.9.1

  # Auth
  local_auth: ^3.0.2

  # Background tasks
  workmanager: ^0.10.10

  # Sensors & location
  sensors_plus: ^7.1.1
  geolocator: ^14.1.1
  battery_plus: ^7.1.2

  # Maps
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Notifications
  flutter_local_notifications: ^22.3.1

  # QR code
  qr_flutter: ^4.1.0

  # Image picking
  image_picker: ^1.2.4

  # Sharing
  share_plus: ^13.3.1

  # UI
  fl_chart: ^1.2.0
  lottie: ^3.6.1
  shimmer: ^4.0.0

  # Codegen annotations
  freezed_annotation: ^3.0.0
  json_annotation: 4.12.0
  # Functional programming
  fpdart: ^1.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.30.0
  flutter_lints: ^6.0.0
  # Direct pin so sqlite3's Dart build hooks (which load SQLite for drift
  # tests since 3.x) track the transitive pin from drift explicitly.
  sqlite3: ^3.7.0
  # Codegen
  freezed: ^4.0.1
  json_serializable: 6.14.1
  build_runner: ^2.16.1
  riverpod_generator: 4.0.9
  drift_dev: 2.35.1
flutter:
  uses-material-design: true
